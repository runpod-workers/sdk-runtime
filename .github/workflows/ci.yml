name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run --no-sync pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Check lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build queue image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/queue.Dockerfile
          load: true
          push: false
          tags: runpod-sdk-runtime:test
          build-args: BASE_IMAGE=python:3.12-slim
          cache-from: type=gha,scope=queue-test
          cache-to: type=gha,mode=max,scope=queue-test

      - name: Verify runtime imports
        run: docker run --rm --entrypoint python runpod-sdk-runtime:test -c "from runpod_sdk_runtime.bootstrap import _sdk_importable; ok, error = _sdk_importable([]); assert ok, error; import runpod_sdk_runtime.queue.worker"
