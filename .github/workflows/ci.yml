name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: sdk-runtime

      - uses: actions/checkout@v7
        with:
          repository: runpod/runpod-python
          ref: feat/apps-sdk
          path: runpod-python

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: sdk-runtime/uv.lock

      - name: Install dependencies
        working-directory: sdk-runtime
        run: |
          uv sync --all-groups
          uv pip install -e ../runpod-python

      - name: Run tests
        working-directory: sdk-runtime
        run: uv run --no-sync pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build queue image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/queue.Dockerfile
          load: true
          push: false
          tags: runpod-sdk-runtime:test
          build-args: |
            BASE_IMAGE=python:3.12-slim
            RUNPOD_PACKAGE_SPEC=https://github.com/runpod/runpod-python/archive/refs/heads/feat/apps-sdk.tar.gz
          cache-from: type=gha,scope=queue-test
          cache-to: type=gha,mode=max,scope=queue-test

      - name: Verify runtime imports
        run: docker run --rm --entrypoint python runpod-sdk-runtime:test -c "import runpod_sdk_runtime.bootstrap"
